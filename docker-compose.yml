services:
  postgres:
    # pgvector/pgvector:pg16 is the official Postgres 16 image with the
    # pgvector extension preinstalled — required by the Phase 5 RAG chatbot.
    image: pgvector/pgvector:pg16
    container_name: officeiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: officeiq
      POSTGRES_PASSWORD: officeiq
      POSTGRES_DB: officeiq
    ports:
      # 5433 on the host, so a locally installed Postgres on 5432 isn't disturbed.
      - "5433:5432"
    volumes:
      - officeiq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U officeiq -d officeiq"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional web UI for inspecting the database: http://localhost:8081
  adminer:
    image: adminer:latest
    container_name: officeiq-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres

  # S3-compatible object storage for uploaded documents (PRD B.2).
  # Console: http://localhost:9001  (officeiq / officeiq123)
  minio:
    image: minio/minio:latest
    container_name: officeiq-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: officeiq
      MINIO_ROOT_PASSWORD: officeiq123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - officeiq_miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: create the documents bucket on first start.
  minio-init:
    image: minio/mc:latest
    container_name: officeiq-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 officeiq officeiq123 &&
      mc mb --ignore-existing local/officeiq-documents &&
      echo 'bucket ready';
      "

volumes:
  officeiq_pgdata:
  officeiq_miniodata:
