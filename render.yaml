# Render blueprint for OfficeIQ.
#
#   Render dashboard -> New -> Blueprint -> pick this repo
#
# Creates a Postgres instance, the FastAPI backend and the built frontend. The
# values marked sync:false are prompted for on first deploy and stored in
# Render's secret manager — they are never committed here.
#
# ENVIRONMENT is "staging", which is what this is: a demo instance, not a
# system holding real employee records. The distinction is load-bearing.
# production_problems() refuses to serve a production process using local disk
# for documents, and on the free tier that is exactly what this does — uploads
# live on the container's filesystem and are lost on redeploy. Labelling it
# production would mean either a 503 on every health check or lying about the
# guarantee. Point STORAGE_BACKEND at S3-compatible storage (Cloudflare R2 has
# a free tier) and this becomes a true production deploy.

services:
  # --- API -----------------------------------------------------------
  - type: web
    name: officeiq-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # Migrations run before the new instance takes traffic, and the demo seed
    # is idempotent, so a redeploy re-running it changes nothing.
    preDeployCommand: "alembic upgrade head && python -m app.seed --demo"
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      # Generated by Render and never seen by anyone, including me.
      - key: SECRET_KEY
        generateValue: true
      - key: FIRST_ADMIN_EMAIL
        value: admin@officeiq.dev
      - key: FIRST_ADMIN_PASSWORD
        sync: false
      # Both point at the frontend service below; Render resolves the URL after
      # it is created, which is what makes the two-service ordering work.
      - key: FRONTEND_BASE_URL
        fromService:
          name: officeiq-web
          type: web
          property: host
      - key: CORS_ORIGINS
        fromService:
          name: officeiq-web
          type: web
          property: host
      # --- Providers --------------------------------------------------------
      - key: CHAT_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: EMBEDDING_PROVIDER
        value: voyage
      - key: VOYAGE_API_KEY
        sync: false
      # --- Email ------------------------------------------------------------
      # Brevo's HTTP API rather than SMTP: Render blocks outbound SMTP on the
      # free tier, so smtplib would hang rather than fail.
      - key: EMAIL_BACKEND
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # --- Storage ----------------------------------------------------------
      # Ephemeral. See the note at the top of this file.
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_LOCAL_ROOT
        value: /app/storage
      # One worker: the rate limiter is per-process, and the free instance has
      # nowhere near the memory for more.
      - key: WEB_CONCURRENCY
        value: "1"

  # --- Frontend -------------------------------------------------------------
  - type: web
    name: officeiq-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # Vite inlines the API URL at build time, so this is a build variable and
    # a backend URL change means a rebuild, not a restart.
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: officeiq-api
          type: web
          property: host
    routes:
      # A single-page app: every unmatched path is the app's own router, not a
      # missing file.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
