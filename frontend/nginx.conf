server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the exact nginx version to every caller.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames change whenever their content does, so they are
    # safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached: it is what points at the current asset
    # hashes, and a stale copy pins the whole app to a previous deploy.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Client-side routing: unknown paths are React Router's business, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The API is served by the backend container. Proxying it here keeps the
    # browser on one origin, so no CORS preflight is needed in production.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Report generation and OCR can take a while on a large document.
        proxy_read_timeout 120s;
        # Matches MAX_UPLOAD_SIZE_MB on the backend; nginx would otherwise
        # reject a large scan with its own 413 before the API ever sees it.
        client_max_body_size 12m;
    }

    location = /health {
        proxy_pass http://api:8000/health;
    }
}
